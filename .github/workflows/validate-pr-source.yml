name: Validate PR source is dev

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate PR source is dev
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "PR: $HEAD_BRANCH -> $BASE_BRANCH"

          if [ "$BASE_BRANCH" = "main" ] && [ "$HEAD_BRANCH" != "dev" ]; then
            echo "::error::PRs into main must come from dev. '$HEAD_BRANCH' is not allowed."
            exit 1
          fi

          echo "Branch check passed."
